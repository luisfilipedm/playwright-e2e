sonar.projectKey=luisfilipedm_playwright-e2e
sonar.organization=luisfilipedm
sonar.projectName=Playwright E2E
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Codigo de apoio (pages/elements) como fonte; cenarios .spec como testes
sonar.sources=src/support
sonar.tests=src/scenarios
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/fixtures/**
sonar.typescript.tsconfigPaths=tsconfig.json

# Pages/elements sao a estrutura dos testes E2E (Page Objects), nao codigo
# de aplicacao: os testes exercitam sites externos, entao nao existe cobertura
# de testes unitarios a medir aqui.
sonar.coverage.exclusions=src/**
